# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Exigence de route pour {_locale}, à garder alignée avec framework.enabled_locales.
    app.locales: 'fr|en'

    # Longueur maximale de l'expression saisie (formulaire et contrôleur).
    app.search.max_keyword_length: 80
    # Expressions gardées après la fusion (les plus populaires), rangées par l'IA dans le champ sémantique avec
    # 16 termes de Wikipédia au plus : 44 candidats, deux paquets de rangement.
    app.ai.max_candidates: 28
    # Modèle Cohere (https://docs.cohere.com/v2/docs/models).
    app.cohere.model: 'command-a-03-2025'

    # Éditeur affiché dans les mentions légales (variables LEGAL_* de .env.local / deploy/prod.env).
    app.legal:
        name: '%env(LEGAL_PUBLISHER)%'
        address: '%env(LEGAL_ADDRESS)%'
        siren: '%env(LEGAL_SIREN)%'
        contact: '%env(LEGAL_CONTACT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            array $enabledLocales: '%kernel.enabled_locales%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Plus petit que le nombre de résultats du faux moteur, pour tester la coupure.
        app.ai.max_candidates: 6

    services:
        # Aucun appel réseau pendant les tests : voir framework.http_client.mock_response_factory.
        App\Tests\Http\FakeHttpResponses:
            public: true
